<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumina</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="brand" id="brandBtn" data-focusable data-tab="home" aria-label="Lumina home">
      <span class="brand-glyph" aria-hidden="true">
        <svg class="od-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
      </span>
      <span class="brand-word">LUMINA</span>
    </button>
    <nav class="main-nav" aria-label="Sections">
      <button class="nav-item" id="navHome" data-focusable data-tab="home" aria-current="page">Home</button>
      <button class="nav-item" data-focusable data-tab="movies">Movies</button>
      <button class="nav-item" data-focusable data-tab="shows">Shows</button>
      <button class="nav-item" data-focusable data-tab="mylist">My List</button>
      <button class="nav-item" data-focusable data-tab="apps">Apps</button>
    </nav>
    <div class="topbar-right">
      <button class="icon-btn" id="searchBtn" data-focusable aria-label="Search">
        <svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      </button>
      <button class="icon-btn" id="liveBtn" data-focusable aria-label="Live TV and inputs">
        <svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 20h8"/></svg>
      </button>
      <button class="icon-btn avatar" id="profileBtn" data-focusable aria-label="Profiles" aria-haspopup="menu" aria-expanded="false"><span id="avatarInitials">S</span></button>
    </div>
  </header>

  <section class="hero" id="hero" aria-label="Featured">
    <div class="hero-bg" aria-hidden="true"><img id="heroBg" alt=""></div>
    <div class="hero-content">
      <p class="eyebrow">Featured</p>
      <h1 class="hero-title" id="heroTitle"></h1>
      <div class="meta-row" id="heroMeta"></div>
      <p class="hero-syn od-clamp-2" id="heroSyn"></p>
      <div class="hero-actions">
        <button class="btn btn-primary" id="heroPlay" data-focusable><svg class="od-icon od-icon-lg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg><span>Play</span></button>
        <button class="btn btn-ghost" id="heroList" data-focusable></button>
      </div>
    </div>
    <div class="hero-art"><img id="heroArt" alt=""></div>
    <div class="hero-dots" id="heroDots" aria-hidden="true"><span class="on"></span><span></span><span></span></div>
  </section>

  <main class="rails" id="rails" aria-label="Browse titles"></main>

  <main class="apps" id="appsEl" aria-label="Apps" hidden></main>
  <div class="rail-fade" aria-hidden="true"></div>
  <div class="hints" aria-hidden="true">
    <span><kbd>▲▼</kbd> move</span><span><kbd>◀▶</kbd> browse</span><span><kbd>OK</kbd> select</span><span><kbd>Back</kbd> back</span>
  </div>
</div>

<div class="overlay detail" id="detail" hidden>
  <div class="detail-backdrop" aria-hidden="true"></div>
  <div class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="detail-bg" aria-hidden="true"><img id="dBg" alt=""></div>
    <div class="detail-poster"><img id="dPoster" alt=""></div>
    <div class="detail-info">
      <h2 id="dTitle"></h2>
      <div class="meta-row" id="dMeta"></div>
      <p class="detail-syn" id="dSyn"></p>
      <p class="detail-credits" id="dCredits"></p>
      <div class="hero-actions">
        <button class="btn btn-primary" id="dPlay" data-focusable><svg class="od-icon od-icon-lg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg><span>Play</span></button>
        <button class="btn btn-ghost" id="dList" data-focusable></button>
      </div>
    </div>
    <button class="icon-btn detail-close" id="dClose" data-focusable aria-label="Close details">
      <svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
</div>

<div class="overlay search" id="search" hidden role="dialog" aria-modal="true" aria-label="Search titles">
  <div class="search-inner">
    <div class="search-bar">
      <svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <label class="sr-only" for="q">Search titles</label>
      <input id="q" type="search" placeholder="Titles, genres, people" autocomplete="off">
      <button class="icon-btn" id="qClose" data-focusable aria-label="Close search">
        <svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <p class="search-hint" id="qHint">Popular now</p>
    <div class="search-grid" id="qGrid"></div>
  </div>
</div>

<div class="overlay player" id="player" hidden>
  <button class="icon-btn player-exit" id="pExit" data-focusable aria-label="Close">
    <svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="player-core">
    <p class="player-kicker" id="pKicker">Opening</p>
    <h2 id="pTitle"></h2>
    <p class="player-note" id="pNote">Stremio is opening — pick a source there to start playback.</p>
  </div>
</div>

<div class="profile-menu" id="pmenu" hidden role="menu" aria-label="Choose profile">
  <button data-focusable role="menuitemradio" data-profile="Shashvat" aria-checked="true"><svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.2" r="3.6"/><path d="M4.8 19.4a7.6 7.6 0 0 1 14.4 0"/></svg>Shashvat<svg class="od-icon pm-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l5 5 10-11"/></svg></button>
  <button data-focusable role="menuitemradio" data-profile="Guest" aria-checked="false"><svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.2" r="3.6"/><path d="M4.8 19.4a7.6 7.6 0 0 1 14.4 0"/></svg>Guest<svg class="od-icon pm-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l5 5 10-11"/></svg></button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/apps.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
